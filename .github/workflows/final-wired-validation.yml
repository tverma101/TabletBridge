name: Final wired efficiency validation

on:
  push:
    branches:
      - perf/runtime-efficiency-2026-09-10

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and build wired APK
        working-directory: AndroidClient
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TabletBridge-final-wired-android
          path: AndroidClient/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate wired scripts
        run: bash -n scripts/setup-usb.sh scripts/run.sh scripts/install.sh scripts/install_android.sh scripts/dev-test.sh
      - name: Test macOS host
        working-directory: MacHost
        run: swift test
      - name: Build macOS release host
        working-directory: MacHost
        run: swift build -c release
      - uses: actions/upload-artifact@v4
        with:
          name: TabletBridge-final-wired-macos
          path: MacHost/.build/release/TabletBridge
          if-no-files-found: error
