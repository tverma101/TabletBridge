name: Wired efficiency validation

on:
  push:
    branches:
      - perf/runtime-efficiency-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android wired client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and build APK
        working-directory: AndroidClient
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TabletBridge-wired-android-debug
          path: AndroidClient/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  macos:
    name: macOS wired host
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate wired helper scripts
        run: bash -n scripts/setup-usb.sh scripts/run.sh scripts/install.sh scripts/install_android.sh scripts/dev-test.sh
      - name: Test host
        working-directory: MacHost
        run: swift test
      - name: Build release host
        working-directory: MacHost
        run: swift build -c release
      - uses: actions/upload-artifact@v4
        with:
          name: TabletBridge-wired-macos-host
          path: MacHost/.build/release/TabletBridge
          if-no-files-found: error
