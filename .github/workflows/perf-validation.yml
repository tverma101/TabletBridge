name: Tablet Bridge performance-pass validation

on:
  push:
    branches:
      - perf/runtime-efficiency-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and test Android client
        working-directory: AndroidClient
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TabletBridge-android-debug
          path: AndroidClient/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  macos:
    name: macOS host
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test macOS host
        working-directory: MacHost
        run: swift test
      - name: Build macOS host
        working-directory: MacHost
        run: swift build -c release
      - uses: actions/upload-artifact@v4
        with:
          name: TabletBridge-macos-host
          path: MacHost/.build/release/TabletBridge
          if-no-files-found: error
