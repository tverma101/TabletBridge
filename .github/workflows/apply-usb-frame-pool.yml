name: Apply USB frame-pool bound

on:
  push:
    branches:
      - perf/runtime-efficiency-2026-09-10

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/runtime-efficiency-2026-09-10
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Bound USB compressed-frame pool
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AndroidClient/app/src/main/java/com/sidescreen/app/StreamClient.kt')
          text = p.read_text()
          old = '''    // Buffer pooling to reduce GC pressure from per-frame allocations\n    // At 60fps with ~100KB frames, this prevents ~6MB/s of allocations\n    private val bufferPool = ArrayDeque<ByteArray>(8)\n    private val poolLock = Any()'''
          new = '''    // Buffer pooling to reduce GC pressure from per-frame allocations. The\n    // wired receive callback returns compressed data immediately after it is\n    // copied into MediaCodec, so keeping eight differently-sized arrays on the\n    // USB loopback path only inflates retained heap after large keyframes.\n    // Keep a two-buffer defensive margin for USB; preserve the historical\n    // wireless pool depth.\n    private val bufferPoolCapacity = if (host == "127.0.0.1") 2 else 8\n    private val bufferPool = ArrayDeque<ByteArray>(bufferPoolCapacity)\n    private val poolLock = Any()'''
          old2 = '''            // Keep pool size limited to prevent memory bloat\n            if (bufferPool.size < 8) {\n                bufferPool.addLast(buffer)\n            }'''
          new2 = '''            // Keep pool size limited to prevent memory bloat.\n            if (bufferPool.size < bufferPoolCapacity) {\n                bufferPool.addLast(buffer)\n            }'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'pool declaration match count={text.count(old)}')
              text = text.replace(old, new, 1)
          if new2 not in text:
              if text.count(old2) != 1:
                  raise SystemExit(f'pool release match count={text.count(old2)}')
              text = text.replace(old2, new2, 1)
          p.write_text(text)
          PY
      - name: Test and build patched Android client
        working-directory: AndroidClient
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TabletBridge-wired-android-pool2
          path: AndroidClient/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Commit validated source patch
        run: |
          if git diff --quiet; then
            echo "USB frame-pool bound already applied"
            exit 0
          fi
          git config user.name "Tablet Bridge CI"
          git config user.email "145865683+tverma101@users.noreply.github.com"
          git add AndroidClient/app/src/main/java/com/sidescreen/app/StreamClient.kt
          git commit -m "perf(usb): bound compressed-frame buffer retention"
          git push origin HEAD:perf/runtime-efficiency-2026-09-10
